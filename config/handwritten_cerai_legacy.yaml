project:
  name: marriage-ocr
  environment: handwritten

record_type: CERAI
layout_variant: legacy

input:
  allowed_extensions:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".tif"
    - ".tiff"
    - ".pdf"
  pdf_dpi: 300

preprocessing:
  processing_width: 3000
  expected_landscape: true
  denoise_kernel_size: 3
  threshold_method: adaptive
  adaptive_block_size: 41
  adaptive_c: 11
  deskew_enabled: true
  deskew_max_angle: 7.5
  min_rotation_for_deskew: 0.15
  hough_threshold: 160
  hough_min_line_length_ratio: 0.35
  hough_max_line_gap: 20

# NOT YET CALIBRATED against real images -- these are placeholder ratios,
# evenly covering the 10 columns seen on input/cerai/image00001-4.jpg and
# input/cerai/image00002.jpg (1997/2009 legacy layout: Bil, Nama Bekas Suami
# dan Isteri, Tempat Cerai, Pendaftar, Keadaan Talak, Jumlah, Tarikh Cerai,
# Tandatangan, Tarikh Keluar, Hal-Hal Lain). Run
# `marriage-ocr process --layout-only --input input/cerai --config
# config/handwritten_cerai_legacy.yaml --debug debug/cerai_legacy` and
# adjust these against the generated table_lines_overlay.jpg /
# record_boxes_overlay.jpg before trusting cell crops from this config.
layout:
  auto_detect_table: true
  auto_detect_columns: true
  fallback_column_ratios:
    bil: [0.00, 0.10]
    suami_isteri: [0.10, 0.24]
    tempat_cerai: [0.24, 0.31]
    pendaftar: [0.31, 0.385]
    keadaan_talak: [0.385, 0.505]
    jumlah: [0.505, 0.6075]
    tarikh_cerai: [0.6075, 0.695]
    tandatangan: [0.695, 0.8425]
    tarikh_keluar: [0.8425, 0.915]
    hal_hal_lain: [0.915, 1.00]
  min_record_height_px: 80
  max_record_height_px: 280

ocr:
  engine: google_vision
  mode: cell_crops
  min_average_confidence: 0.50
  save_raw_json: true
  field_refinement:
    enabled: false
  google_vision:
    language_hints:
      - ms
      - en
  mock:
    prefix: MOCK_OCR
    base_confidence: 0.82
  paddle:
    use_angle_cls: true
    lang: en
    show_log: false

llm:
  enabled: true
  provider: gemini
  model: gemini-3.1-pro-preview
  temperature: 0.0
  max_output_tokens: 4096
  save_raw_json: true
  prefer_gemini_threshold: 0.55
  review_below_field_confidence: 0.65

debug:
  retain_artifacts: true

validation:
  ok_confidence_threshold: 0.85
  min_age: 15
  max_age: 100
  require_tarikh_cerai: true

export:
  append: true
  dedupe: true
  sheet_name: Records
  include_debug_paths: false
  include_raw_columns: false
  columns:
    - Record Type
    - Bil
    - No Rujukan
    - No Siri
    - Tarikh Daftar
    - Nama Suami
    - IC Suami
    - Nama Isteri
    - IC Isteri
    - Tempat Cerai
    - Nama Pendaftar
    - Keadaan Talak
    - Jumlah Talak
    - Tarikh Nikah
    - Tarikh Cerai
    - Bil Daftar Rujukan
    - Tarikh Keluar
    - Catatan Raw
    - Hal Hal Lain
    - Confidence
    - Status

review:
  reviewer_name: handwritten-reviewer
  export_path: data/reviewed_exports/handwritten_cerai_legacy_reviewed.xlsx

training_export:
  output_dir: data/ground_truth
  crops_dir: training_crops
  labels_file: labels.tsv
  train_file: train.tsv
  validation_file: val.tsv
  manifest_file: manifest.jsonl
  stats_file: stats.json
  verified_only: true
  validation_ratio: 0.20

logging:
  level: INFO
  directory: logs
  error_report_dir: logs/error_reports
  filename_prefix: marriage-ocr
  max_bytes: 10485760
  backup_count: 10
  console: true
  file: true

postprocess:
  bil_sequence:
    enabled: true
    start_number: null
    year: null
