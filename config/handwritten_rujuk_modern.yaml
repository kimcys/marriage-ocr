project:
  name: marriage-ocr
  environment: handwritten

record_type: RUJUK
layout_variant: modern

# Full-Gemini-per-page: one Gemini call reads the whole page and returns
# every record on it directly -- no Vision OCR, no cell_crops, no
# deterministic parser. See src/marriage_ocr/gemini_page_pipeline.py.
pipeline:
  engine: gemini_page

input:
  allowed_extensions:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".tif"
    - ".tiff"
    - ".pdf"
  pdf_dpi: 300

preprocessing:
  processing_width: 3000
  expected_landscape: true
  denoise_kernel_size: 3
  threshold_method: adaptive
  adaptive_block_size: 41
  adaptive_c: 11
  deskew_enabled: true
  deskew_max_angle: 7.5
  min_rotation_for_deskew: 0.15
  hough_threshold: 160
  hough_min_line_length_ratio: 0.35
  hough_max_line_gap: 20

# NOT YET CALIBRATED against real images -- placeholder ratios covering the
# 5 columns seen on input/rujuk/image00002-3.jpg (2024 modern layout: Bil
# Daftar/Tarikh Daftar/No.Siri, Nama+IC, Tarikh Rujuk, Tandatangan+Tarikh
# Keluar, Catatan). Run `marriage-ocr process --layout-only --input
# input/rujuk --config config/handwritten_rujuk_modern.yaml --debug
# debug/rujuk_modern` and adjust these against the generated
# table_lines_overlay.jpg / record_boxes_overlay.jpg before trusting cell
# crops from this config.
layout:
  auto_detect_table: true
  auto_detect_columns: true
  fallback_column_ratios:
    bil: [0.00, 0.14]
    suami_isteri: [0.14, 0.50]
    tarikh_rujuk: [0.50, 0.61]
    tandatangan: [0.61, 0.73]
    catatan: [0.73, 1.00]
  # The modern layout allots ~9 blank ruled rows per entry (vs. the legacy
  # layout's tightly-packed 80-280px rows) -- measured ~825px between two
  # real Bil markers on input/rujuk/image00002-3.jpg. The original
  # handwritten.yaml-derived 80/280 values caused _detect_record_boxes to
  # heavily penalize (and reject) the correctly-sized box, merging two real
  # entries into one and stranding an empty phantom record below them.
  min_record_height_px: 100
  max_record_height_px: 1000

ocr:
  engine: google_vision
  mode: cell_crops
  min_average_confidence: 0.50
  save_raw_json: true
  field_refinement:
    enabled: false
  google_vision:
    language_hints:
      - ms
      - en
  mock:
    prefix: MOCK_OCR
    base_confidence: 0.82
  paddle:
    use_angle_cls: true
    lang: en
    show_log: false

llm:
  enabled: true
  provider: gemini
  model: gemini-3-flash-preview
  temperature: 0.0
  max_output_tokens: 4096
  save_raw_json: true
  prefer_gemini_threshold: 0.55
  review_below_field_confidence: 0.65

debug:
  retain_artifacts: true

validation:
  ok_confidence_threshold: 0.85
  min_age: 15
  max_age: 100
  require_tarikh_rujuk: true

export:
  append: true
  dedupe: true
  sheet_name: Records
  include_debug_paths: false
  include_raw_columns: false
  columns:
    - Record Type
    - Bil
    - No Rujukan
    - No Siri
    - Tarikh Daftar
    - Nama Suami
    - Umur Suami
    - IC Suami
    - Bangsa Suami
    - Warganegara Suami
    - Alamat Suami
    - Nama Isteri
    - Umur Isteri
    - IC Isteri
    - Bangsa Isteri
    - Warganegara Isteri
    - Alamat Isteri
    - Tempat Rujuk
    - Daerah
    - Negeri
    - Nama Pendaftar
    - Bil Cerai
    - Rujuk Kali
    - Tarikh Cerai
    - Tarikh Nikah
    - Tarikh Rujuk
    - Tarikh Keluar
    - Catatan Raw
    - Hal Hal Lain
    - No Telefon
    - Confidence
    - Status

review:
  reviewer_name: handwritten-reviewer
  export_path: data/reviewed_exports/handwritten_rujuk_modern_reviewed.xlsx

training_export:
  output_dir: data/ground_truth
  crops_dir: training_crops
  labels_file: labels.tsv
  train_file: train.tsv
  validation_file: val.tsv
  manifest_file: manifest.jsonl
  stats_file: stats.json
  verified_only: true
  validation_ratio: 0.20

logging:
  level: INFO
  directory: logs
  error_report_dir: logs/error_reports
  filename_prefix: marriage-ocr
  max_bytes: 10485760
  backup_count: 10
  console: true
  file: true

postprocess:
  bil_sequence:
    enabled: false
    start_number: null
    year: null
