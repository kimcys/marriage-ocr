services:
  postgres:
    image: postgres:16
    container_name: marriage_ocr_postgres
    environment:
      POSTGRES_DB: marriagedb
      POSTGRES_USER: postgres
      # Read from .env (gitignored) -- never hardcode a real password here,
      # this file is committed. See .env.example for the variable name.
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - marriage_ocr_pgdata:/var/lib/postgresql/data

volumes:
  marriage_ocr_pgdata: