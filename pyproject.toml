[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marriage-ocr"
version = "0.1.0"
description = "OCR-assisted handwritten marriage register extraction to XLSX"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0.0",
    "openpyxl>=3.1.0",
    "opencv-python-headless>=4.10.0",
    "PyMuPDF>=1.24.0",
    "PyYAML>=6.0.0",
    "psycopg[binary]>=3.2.0",
    "python-dotenv>=1.0.1",
    "rich>=13.0.0",
    "streamlit>=1.45.0",
    "typer>=0.12.0",
    "google-cloud-vision>=3.10.0",
    "google-genai",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
